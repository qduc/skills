# Worker brief — <task-id>
# A fresh worker sees only this brief and what it points to. Anything it
# needs to know about other tasks, conventions, or prior decisions must be
# here or linked from here.

objective: <concrete outcome to produce>
reason: <why this task matters; what depends on it>

context:
  wiki: [<relevant wiki pages>]
  sources: [<files, issues, commits, prior findings>]

current_state: |
  <known facts and decisions; label anything uncertain>
  <interfaces or files other tasks are changing that this one touches>

scope:
  allowed: <what the worker may change or investigate>
  excluded: <what must remain untouched>

workspace: <exact repo path or isolated worktree>
base_commit: <sha, for engineering tasks>
dependencies: <required inputs and accepted upstream tasks>

# Each criterion pairs what is done with how to do it and what proves it.
# Write the observable result before anyone drives anything, so passing is a
# comparison, not an impression. For state changes, the proof is a second
# read-only view of the stored value (reopen, re-query), not a success
# message. List every user entry point the change affects; one entry point
# passing does not verify another.
acceptance_criteria:
  - id: <short-id>
    action: <what the user or caller does>
    command: <exact command, selector, or request that performs it>
    observable: <the specific state, output, or side effect that proves it>
    entry_points: [<e.g. toolbar button, keyboard shortcut, CLI>]

verification:
  # If the project has a verification skill (verify-<app>/ in its skill
  # directory), give its path and the features picked from its Change
  # selection table for this task's paths; otherwise list the commands.
  skill: "<path to verify-<app>/, or none — not yet created, or dead end and its reason>"
  features:
    full: [<feature files to drive in full>]
    smoke: [<feature files matched only through shared paths — drive their smoke steps>]
  # User-facing paths this task touches that match no feature: add a feature
  # file and selection row, and drive it once.
  extend: [<paths>]
  # For a fix to a bug the verify layer should have caught:
  regression: "<feature file + bug ref — add a Regression step, show it fail before the fix and pass after>"
  # Adding knowledge to the map is in scope (gotchas, regression steps, new
  # feature files). Changing an expected result to match what you saw is not:
  # log it to features/DRIFT.md instead.
  commands:
    - <actual project command, e.g. pnpm test path/to/spec>

constraints:
  - <tool, security, budget, model, process constraints>
  - Do not spawn additional workers.
  - If a material fact or decision is missing, stop and report NEEDS_CONTEXT
    rather than guessing.

return_contract:
  report_path: <runs/<plan-id>/reports/<task-id>.md>
  status: DONE | DONE_WITH_CONCERNS | BLOCKED | NEEDS_CONTEXT | FAILED
  sections:
    summary: what changed or was found
    files_touched: list
    commands: each command run, with its outcome
    verification: >-
      one line per acceptance criterion and entry point:
      verified | failed | verified-unreachable | skipped.
      verified and failed name the artifact (transcript, snapshot, response).
      verified-unreachable names the unmet prerequisite and the route tried.
      skipped says why. Never mark an entry point verified through another.
    decisions: choices made and why
    assumptions: >-
      what you decided where this brief was silent — the most useful section
      for catching context gaps, so list even ones that felt obvious
    could_not_verify: what was outside your view or couldn't be checked here
    deviations: anything done differently from the brief, and why
    risks: open concerns
    artifacts: paths
